# Statistics, model and figures (scripts/analyse_sweep.py, fit_model.py,
# make_figures.py, build_report.py). Pinned to the exact versions the published
# results were produced with. statsmodels is listed explicitly: it was present
# in the 'ml' environment only as a transitive dependency, so rebuilding that
# environment from envs/ml.yaml was not guaranteed to provide it.
name: analysis
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas=3.0.5
  - numpy=2.4.6
  - scipy=1.17.1
  - statsmodels=0.14.6
  - scikit-learn=1.9.0
  - matplotlib=3.11.1
